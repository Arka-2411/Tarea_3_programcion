<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agenda Kanban - Tarea 3</title>
    <link rel="stylesheet" href="agenda.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="main-container">
        <header>
            <h1>Gestor de Tareas</h1>
            <div class="input-group">
                <input type="text" id="inputTarea" placeholder="Nueva tarea...">
                <button id="btnAgregar" onclick="agregarTarea()">
                    <i class="fas fa-plus"></i> Agregar
                </button>
            </div>
        </header>

        <div class="kanban-board">
            <div class="column col-pending">
                <div class="col-header"><h2><i class="fas fa-clock"></i> Pendientes</h2></div>
                <ul id="listaPendientes" class="task-list"></ul>
            </div>
            <div class="column col-process">
                <div class="col-header"><h2><i class="fas fa-spinner"></i> En Proceso</h2></div>
                <ul id="listaProceso" class="task-list"></ul>
            </div>
            <div class="column col-completed">
                <div class="col-header"><h2><i class="fas fa-check-circle"></i> Realizadas</h2></div>
                <ul id="listaRealizadas" class="task-list"></ul>
            </div>
        </div>
        
        <div class="footer-controls">
            <button onclick="limpiarTodo()" class="btn-clear">Borrar Todo</button>
        </div>
    </div>
    <script src="agenda.js"></script>
</body>
</html>
